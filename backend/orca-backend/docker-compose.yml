services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      FORCE_MOCK: ${FORCE_MOCK:-false}
      DEMO_SCENARIOS: ${DEMO_SCENARIOS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./cache:/app/cache            # warm cache survives restarts
      - ./data/boundaries:/app/data/boundaries:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
